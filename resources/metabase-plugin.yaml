info:
  name: Metabase StarRocks Driver
  version: 1.0.0
  description: StarRocks driver for Metabase with multi-catalog support.

driver:
  name: starrocks
  display-name: StarRocks
  lazy-load: true
  parent: sql-jdbc
  connection-properties:
    - host
    - merge:
        - port
        - default: 9030
    - merge:
        - dbname
        - name: catalog
          placeholder: default_catalog
          display-name: Catalog (optional)
          required: false
          helper-text: "One StarRocks catalog, e.g. 'default_catalog' for internal tables or 'hive_catalog' for an external one. Leave empty to sync every catalog the account can see; schemas are then named catalog.database."
    - name: dbname
      display-name: Database (optional)
      required: false
      helper-text: "Specific database within the catalog. Leave empty to see all databases. Ignored when Catalog is empty."
    - user
    - password
    - name: schema-filters
      type: schema-filters
      display-name: Schemas
      placeholder: "sales_*, finance"
    - ssh-tunnel
    - advanced-options-start
    - merge:
        - additional-options
        - placeholder: "tinyInt1isBit=false"
    - default-advanced-options

init:
  - step: load-namespace
    namespace: metabase.driver.starrocks
  - step: register-jdbc-driver
    class: org.mariadb.jdbc.Driver

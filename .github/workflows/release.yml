name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Set up Java
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Clojure CLI
        uses: DeLaGuardo/setup-clojure@bc7570e912b028bbcc22f457adec7fdf98e2f4ed # 12.5
        with:
          cli: latest

      - name: Build JAR
        run: clojure -T:build uber

      - name: Rename JAR with version
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: mv target/starrocks.metabase-driver.jar "target/starrocks.metabase-driver-${VERSION}.jar"

      - name: Create Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: target/starrocks.metabase-driver-${{ steps.version.outputs.VERSION }}.jar
          generate_release_notes: true
          body: |
            ## Installation

            1. Download `starrocks.metabase-driver-${{ steps.version.outputs.VERSION }}.jar`
            2. Copy to your Metabase plugins directory
            3. Restart Metabase

            See [README](https://github.com/${{ github.repository }}/blob/main/README.md) for detailed instructions.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

